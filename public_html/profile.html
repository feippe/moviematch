<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | MovieMatch</title>

    <link rel="stylesheet" href="css/app.css">
    <script src="js/profile.js" defer></script>
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <h1>MovieMatch</h1>

            <h2>Your Profile</h2>

            <p class="subtitle">
                Tell us about yourself so we can find your movie match.
            </p>

            <form id="profileForm">

                <div class="form-group">
                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        maxlength="60"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="birthDate">Date of Birth</label>

                    <input
                        type="date"
                        id="birthDate"
                        name="birthDate"
                        autocomplete="bday"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="sex">Sex</label>

                    <select id="sex" name="sex" required>
                        <option value="">Select...</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="matchWith">I want to match with</label>

                    <select id="matchWith" name="matchWith" required>
                        <option value="any">No preference</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                    </select>
                </div>

                <p id="errorMessage" class="error-message" role="alert"></p>

                <button type="submit">Save Profile</button>

            </form>

            <p class="auth-link">
                <a href="app.html">Back to the app</a>
            </p>

        </div>

    </main>

</body>
</html>
