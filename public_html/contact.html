<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Match | MovieMatch</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <h1>MovieMatch</h1>
            <h2>Your Match</h2>

            <p class="subtitle">
                You both accepted! You can now connect.
            </p>

            <section id="contactDetails" class="contact-details">
                <h3>Match Contact Information</h3>
                <p class="contact-status">
                    Contact information will appear here once both users
                    have accepted the match.
                </p>
            </section>

            <p id="message" role="status"></p>

            <p class="auth-link">
                <a href="matches.html">Back to Matches</a>
            </p>
        </div>
    </main>
</body>
</html>
