<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Matches | MovieMatch</title>

    <link rel="stylesheet" href="css/app.css">
    <script src="js/matches.js" defer></script>
</head>

<body>

    <main class="auth-container">

        <div class="auth-card">

            <h1>MovieMatch</h1>

            <h2>My Matches</h2>

            <p class="subtitle">
                Here are people who share your love for movies.
            </p>

            <section id="matchesList">
                <p>Loading your matches...</p>
            </section>

            <p id="message" role="status"></p>

            <p class="auth-link">
                <a href="app.html">Back to the app</a>
            </p>

        </div>

    </main>

</body>
</html>
